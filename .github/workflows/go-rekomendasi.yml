name: Build & push service Go rekomendasi

# Kenapa GHCR, bukan ACR: ACR Tasks tidak tersedia di region indonesiacentral,
# jadi `az acr build` gagal di sana. GHCR gratis untuk repo publik dan image-nya
# bisa ditarik Container App tanpa biaya registry.

on:
  push:
    branches: [feat/go-service, main]
    paths:
      - 'go-umkm/**'
      - '.github/workflows/go-rekomendasi.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/adriankiv/umkm-rekomendasi

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-umkm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-umkm/go.mod
          cache-dependency-path: go-umkm/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (unit, tanpa DB)
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./go-umkm
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
